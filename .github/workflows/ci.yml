# CI do Audit Service: em cada pull request, lint e, só se passar, testes.
# O serviço é autocontido (não depende de bibliotecas de outros repositórios).
name: CI Audit Service

on:
  pull_request:

concurrency:
  group: ci-audit_service-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      # Não há Checkstyle/Spotless no projeto (adicionar exige aprovação de dependência): por ora o lint é a compilação
      # do serviço com os avisos do compilador ligados.
      - name: Compilar com avisos do compilador
        run: mvn -B -ntp -DskipTests -Dmaven.compiler.showWarnings=true compile

  test:
    name: Testes
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      # Os testes de integração usam PostgreSQL embarcado: não precisam de Docker.
      - name: Testes
        run: mvn -B -ntp test
